<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FMF parser smoke test</title><body style="font:16px system-ui;padding:1rem"><h1>FMF index parser smoke test</h1><pre id="out">Menjalankan…</pre><script type="module">
import { parseIndex } from '../src/fmf-parser.js';
const out=document.querySelector('#out');
function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
function u64(n){let x=BigInt(n),a=[];for(let i=0;i<8;i++){a.push(Number(x&255n));x>>=8n}return a}
function str(s){const b=[...new TextEncoder().encode(s)];return [...u32(b.length),...b]}
const bytes=new Uint8Array([
  ...str('root'), ...u32(1), ...str('hello'), ...str('.txt'),
  ...u64(0), ...u64(5), ...u64(5), ...u64(0), ...u64(0), ...u32(0)
]);
try { const r=parseIndex(bytes,5); if(r.files.length!==1||r.files[0].path!=='root/hello.txt'||!r.files[0].boundsOK)throw new Error('Nilai hasil tidak sesuai'); out.textContent='LULUS\nFile: '+r.files[0].path+'\nUkuran: '+r.files[0].storedSize+' byte'; }
catch(e){out.textContent='GAGAL\n'+e.stack;}
</script></body></html>
